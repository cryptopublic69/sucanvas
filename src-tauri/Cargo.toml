[package]
name = "infinite-canvas"
version = "1.0.0"
description = "A local-first infinite canvas for AI workflows"
authors = ["Raydio"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "infinite_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tower-http = { version = "0.7.0", features = ["cors", "limit", "trace"] }
thiserror = "2.0.19"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
argon2 = "0.5"
tauri-plugin-dialog = "2"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
image = { version = "0.25.8", default-features = false, features = ["avif", "bmp", "gif", "jpeg", "png", "webp"] }
